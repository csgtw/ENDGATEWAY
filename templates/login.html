<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>END GATEWAY — Connexion</title>
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">
    <defs>
      <filter id="glass-grain" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.68 0.72" numOctaves="4" seed="5" stitchTiles="stitch" result="noise"/>
        <feColorMatrix type="saturate" values="0" in="noise" result="gray"/>
        <feBlend in="SourceGraphic" in2="gray" mode="overlay" result="blend"/>
        <feComposite in="blend" in2="SourceGraphic" operator="in"/>
      </filter>
    </defs>
  </svg>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo">END GATEWAY</div>
      <div class="auth-sub">Panneau de contrôle</div>
      <form method="post" class="auth-form">
        <div class="field">
          <label>Mot de passe</label>
          <input class="input" type="password" name="password"
                 autocomplete="current-password" autofocus />
        </div>
        <button class="btn btn--primary auth-submit" type="submit">Se connecter</button>
      </form>
    </div>
  </div>
</body>
</html>
